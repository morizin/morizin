<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" role="img" aria-label="GitHub stats: morizin">
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--accent:#0969da;--line:#d0d7de}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--accent:#58a6ff;--line:#30363d}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.bg{fill:var(--bg);stroke:var(--line)}.title{font-size:16px;font-weight:600;fill:var(--accent)}
.label{font-size:12px;fill:var(--muted)}.value{font-size:22px;font-weight:600;fill:var(--fg)}.name{font-size:12px;fill:var(--fg)}.pct{font-size:12px;fill:var(--muted)}
</style>
<rect class="bg" x="0.5" y="0.5" width="494" height="204" rx="8"/>
<text class="title" x="24" y="34">GitHub stats: morizin</text>
<text class="label" x="24" y="70">Stars earned</text><text class="value" x="24" y="94">13</text>
<text class="label" x="24" y="114">Commits, last 12 months</text><text class="value" x="24" y="138">203</text>
<text class="label" x="24" y="158">Pull requests, last 12 months</text><text class="value" x="24" y="182">14</text>
<text class="label" x="260" y="70">Public repositories</text><text class="value" x="260" y="94">49</text>
<text class="label" x="260" y="114">Followers</text><text class="value" x="260" y="138">96</text>
<text class="label" x="260" y="158">Issues, last 12 months</text><text class="value" x="260" y="182">3</text>
</svg>
