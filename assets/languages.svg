<svg xmlns="http://www.w3.org/2000/svg" width="495" height="205" viewBox="0 0 495 205" role="img" aria-label="Top languages (notebooks excluded)">
<style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#656d76;--accent:#0969da;--line:#d0d7de}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--accent:#58a6ff;--line:#30363d}}
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.bg{fill:var(--bg);stroke:var(--line)}.title{font-size:16px;font-weight:600;fill:var(--accent)}
.label{font-size:12px;fill:var(--muted)}.value{font-size:22px;font-weight:600;fill:var(--fg)}.name{font-size:12px;fill:var(--fg)}.pct{font-size:12px;fill:var(--muted)}
</style>
<rect class="bg" x="0.5" y="0.5" width="494" height="204" rx="8"/>
<text class="title" x="24" y="34">Top languages (notebooks excluded)</text>
<clipPath id="r"><rect x="24" y="52" width="447" height="10" rx="5"/></clipPath><g clip-path="url(#r)"><rect x="24.0" y="52" width="343.9" height="10" fill="#3572A5"/><rect x="367.9" y="52" width="55.6" height="10" fill="#3178c6"/><rect x="423.5" y="52" width="34.4" height="10" fill="#dea584"/><rect x="457.9" y="52" width="11.3" height="10" fill="#76b900"/><rect x="469.2" y="52" width="1.7" height="10" fill="#8a8a8a"/><rect x="470.8" y="52" width="1.0" height="10" fill="#f1e05a"/></g>
<circle cx="29" cy="92" r="5" fill="#3572A5"/><text class="name" x="42" y="96">Python</text><text class="pct" x="174" y="96">76.9%</text>
<circle cx="265" cy="92" r="5" fill="#3178c6"/><text class="name" x="278" y="96">TypeScript</text><text class="pct" x="410" y="96">12.4%</text>
<circle cx="29" cy="122" r="5" fill="#dea584"/><text class="name" x="42" y="126">Rust</text><text class="pct" x="174" y="126">7.7%</text>
<circle cx="265" cy="122" r="5" fill="#76b900"/><text class="name" x="278" y="126">Cuda</text><text class="pct" x="410" y="126">2.5%</text>
<circle cx="29" cy="152" r="5" fill="#8a8a8a"/><text class="name" x="42" y="156">C</text><text class="pct" x="174" y="156">0.4%</text>
<circle cx="265" cy="152" r="5" fill="#f1e05a"/><text class="name" x="278" y="156">JavaScript</text><text class="pct" x="410" y="156">0.0%</text>
</svg>
